<svg xmlns="http://www.w3.org/2000/svg" class="hero-art" viewBox="0 0 420 380" role="img" aria-label="Illustration of friends ticking off a shared checklist">
  <ellipse cx="210" cy="350" rx="150" ry="14" class="hero-art__shadow" />

  <g class="hero-art__board">
    <rect x="70" y="40" width="280" height="290" rx="22" class="hero-art__card" />
    <rect x="70" y="40" width="280" height="56" rx="22" class="hero-art__head" />
    <rect x="70" y="74" width="280" height="22" class="hero-art__head" />
    <rect x="96" y="60" width="120" height="14" rx="7" class="hero-art__title" />

    <g class="hero-art__row hero-art__row--1">
      <rect x="96" y="120" width="26" height="26" rx="7" class="hero-art__box" />
      <path d="M102 133 l6 6 l11 -12" class="hero-art__tick" />
      <rect x="136" y="126" width="150" height="12" rx="6" class="hero-art__line" />
      <circle cx="314" cy="133" r="12" fill="#7c3aed" />
    </g>
    <g class="hero-art__row hero-art__row--2">
      <rect x="96" y="170" width="26" height="26" rx="7" class="hero-art__box" />
      <path d="M102 183 l6 6 l11 -12" class="hero-art__tick" />
      <rect x="136" y="176" width="120" height="12" rx="6" class="hero-art__line" />
      <circle cx="314" cy="183" r="12" fill="#db2777" />
    </g>
    <g class="hero-art__row hero-art__row--3">
      <rect x="96" y="220" width="26" height="26" rx="7" class="hero-art__box" />
      <path d="M102 233 l6 6 l11 -12" class="hero-art__tick" />
      <rect x="136" y="226" width="160" height="12" rx="6" class="hero-art__line" />
      <circle cx="314" cy="233" r="12" fill="#059669" />
    </g>
    <g class="hero-art__row">
      <rect x="96" y="270" width="26" height="26" rx="7" class="hero-art__box hero-art__box--empty" />
      <rect x="136" y="276" width="100" height="12" rx="6" class="hero-art__line" />
      <circle cx="314" cy="283" r="12" fill="#2563eb" />
    </g>
  </g>

  <g class="hero-art__float hero-art__float--a">
    <circle cx="42" cy="110" r="24" fill="#7c3aed" />
    <text x="42" y="116" text-anchor="middle" class="hero-art__initials">AK</text>
  </g>
  <g class="hero-art__float hero-art__float--b">
    <circle cx="384" cy="70" r="20" fill="#db2777" />
    <text x="384" y="76" text-anchor="middle" class="hero-art__initials">PS</text>
  </g>
  <g class="hero-art__float hero-art__float--c">
    <circle cx="380" cy="270" r="22" fill="#059669" />
    <text x="380" y="276" text-anchor="middle" class="hero-art__initials">NM</text>
  </g>

  <circle cx="40" cy="250" r="5" class="hero-art__spark" />
  <circle cx="400" cy="170" r="4" class="hero-art__spark hero-art__spark--late" />
  <circle cx="60" cy="40" r="3" class="hero-art__spark hero-art__spark--late" />
